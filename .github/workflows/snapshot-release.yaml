name: Snapshot Release

# Manually publish prerelease builds (e.g. release candidates) of every package
# that has a pending changeset on the chosen branch. Versions look like
# 0.1.1-rc-20260914183000 and are published under the chosen npm dist-tag, so
# `latest` is never touched. Run from the Actions tab or:
#   gh workflow run snapshot-release.yaml --ref <branch> -f tag=rc

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag and version suffix (rc, next, beta...)"
        required: true
        default: rc
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # npm provenance attestations
  contents: read

jobs:
  snapshot:
    name: Publish snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish to latest
        if: ${{ inputs.tag == 'latest' }}
        run: |
          echo "Snapshot releases must not use the 'latest' dist-tag." >&2
          exit 1

      - name: Checkout Repo
        uses: actions/checkout@v6 # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@v6 # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install Dependencies
        run: pnpm install --prefer-offline

      - name: Check npm credentials
        # Fail before versioning or building if the token is expired or missing.
        run: echo "Publishing as npm user $(npm whoami)"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}

      - name: Apply snapshot versions
        run: pnpm changeset version --snapshot ${{ inputs.tag }}

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        run: pnpm publish -r --tag ${{ inputs.tag }} --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
          NPM_CONFIG_PROVENANCE: "true"

name: Release

# Pushes to main run the normal changesets flow: open or update the
# "Version Packages" pull request, or publish to npm when that PR lands.
#
# Running this workflow manually publishes a snapshot prerelease instead: every
# package with a pending changeset on the chosen branch is versioned as
# <next-version>-<tag>-<datetime> and published under the chosen npm dist-tag,
# so `latest` is never touched. Both paths publish with npm trusted publishing
# (OIDC), which is bound to this workflow file.
#
#   gh workflow run release.yaml --ref <branch> -f tag=rc

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag and version suffix for the snapshot prerelease (rc, next, beta...)"
        required: true
        default: rc
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write  # Required for OIDC
  contents: write # Required to push tags and releases
  pull-requests: write # Required for changesets to create release PRs

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to publish a snapshot to latest
        if: github.event_name == 'workflow_dispatch' && inputs.tag == 'latest'
        run: |
          echo "Snapshot releases must not use the 'latest' dist-tag." >&2
          exit 1

      - name: Checkout Repo
        uses: actions/checkout@v6 # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@v6 # v6.3.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --prefer-offline

      - name: Create Release Pull Request or Publish to npm
        if: github.event_name == 'push'
        id: changesets
        uses: changesets/action@v1 # v1.7.0
        with:
          version: pnpm run version
          publish: pnpm publish -r
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply snapshot versions
        if: github.event_name == 'workflow_dispatch'
        run: pnpm changeset version --snapshot ${{ inputs.tag }}

      - name: Publish snapshot to npm
        if: github.event_name == 'workflow_dispatch'
        run: pnpm publish -r --tag ${{ inputs.tag }} --no-git-checks
